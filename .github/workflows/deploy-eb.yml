name: CI-CD Elastic Beanstalk

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore FBZSystemMvc/FBZSystemMvc.csproj

      - name: Build
        run: dotnet build FBZSystemMvc/FBZSystemMvc.csproj -c Release --no-restore

      - name: Test
        run: dotnet test FBZSystemMvc/FBZSystemMvc.Tests/FBZSystemMvc.Tests.csproj -c Release --no-build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: dotnet publish FBZSystemMvc/FBZSystemMvc.csproj -c Release -o publish

      - name: Zip artifact
        run: cd publish && zip -r ../deploy.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy.zip s3://elasticbeanstalk-us-east-1-${{ secrets.AWS_ACCOUNT_ID }}/fbzsystemmvc/${{ github.sha }}.zip

      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name fbzsystemmvc \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-1-${{ secrets.AWS_ACCOUNT_ID }}",S3Key="fbzsystemmvc/${{ github.sha }}.zip"

      - name: Update EB environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name fbzsystemmvc-env \
            --version-label ${{ github.sha }}